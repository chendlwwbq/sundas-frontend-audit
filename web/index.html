<!doctype html>

<html lang="zh-CN" class="font-sans">

    <head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' ws://127.0.0.1:* ws://localhost:* data: blob:; font-src 'self' data:; worker-src 'self' blob:;">

        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <meta name="description" content="AI 视频创作工作台" />

        <meta name="theme-color" content="#121212" />

        <link rel="icon" href="/brand/sundas-favicon.svg" />

        <style>

            /* 首屏底色：CSS 加载前就铺 #121212，避免白闪 */

            html, body { margin: 0; background: #121212; color: #ffffff; }

        </style>

        <title>sundas</title>

        <script>

            /* 发版后旧页面引用的 lazy chunk 已被替换时，先自动刷新一次，避免落到原始错误页。 */

            (function () {

                var key = "sundas:chunk-reload";

                function isChunkError(value) {

                    return /Failed to fetch dynamically imported module|Importing a module script failed|error loading dynamically imported module|ChunkLoadError/i.test(String(value || ""));

                }

                function reloadOnce() {

                    try {

                        if (sessionStorage.getItem(key)) return;

                        sessionStorage.setItem(key, "1");

                    } catch (error) {}

                    location.reload();

                }

                window.addEventListener("vite:preloadError", function (event) {

                    event.preventDefault();

                    reloadOnce();

                });

                window.addEventListener("unhandledrejection", function (event) {

                    if (!isChunkError(event.reason && event.reason.message || event.reason)) return;

                    event.preventDefault();

                    reloadOnce();

                });

                window.addEventListener("error", function (event) {

                    if (isChunkError(event.message)) reloadOnce();

                });

            })();

        </script>

        <script>

            /* 主题锁定暗色（浅色模式已移除） */

            document.documentElement.classList.add("dark");

            document.documentElement.style.colorScheme = "dark";

        </script>

    </head>

    <body class="bg-background text-foreground antialiased">

        <div id="root"></div>

        <script src="/config.js"></script>

        <script type="module" src="/src/main.tsx"></script>

    </body>

</html>
